name: Windows Runner Test

on:
  workflow_dispatch:

jobs:
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Show runner information
        shell: powershell
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:RUNNER_ARCH"

      - name: Test PowerShell
        shell: powershell
        run: |
          Write-Host "PowerShell is working."
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsArchitecture

      - name: Test environment variables
        shell: powershell
        run: |
          Write-Host "Repository: $env:GITHUB_REPOSITORY"
          Write-Host "Run ID: $env:GITHUB_RUN_ID"
          Write-Host "Workflow: $env:GITHUB_WORKFLOW"

      - name: Finish
        shell: powershell
        run: |
          Write-Host "Workflow completed successfully."
